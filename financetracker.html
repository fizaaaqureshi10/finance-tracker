<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Tracker</title>
  <link rel="stylesheet" href="./financetracker.css">
</head>
<body>

  <div class="container">
    <h1>💰 Finance Tracker</h1>

    <!-- Balance -->
    <div class="balance-box">
      <h2>Total Balance</h2>
      <h3 id="balance">₹0.00</h3>
    </div>

    <!-- Income & Expense Summary -->
    <div class="summary">
      <div class="income">
        <p>Income</p>
        <span id="total-income">₹0.00</span>
      </div>
      <div class="expense">
        <p>Expense</p>
        <span id="total-expense">₹0.00</span>
      </div>
    </div>

    <!-- Add Transaction Form -->
    <div class="form-box">
      <h3>Add Transaction</h3>
      <input type="text" id="desc" placeholder="Description (e.g. Salary, Food)">
      <input type="number" id="amount" placeholder="Amount (use - for expense)">
      <button onclick="addTransaction()">Add</button>
    </div>

    <!-- Transaction List -->
    <div class="history">
      <h3>Transaction History</h3>
      <ul id="list"></ul>
    </div>
  </div>

  <script src="./financetracker.js"></script>
</body>
</html>
